name: "Build"

# Pushes to dev and tags build here; every other branch builds through its
# pull request, so a PR commit is compiled once instead of twice.
# A tag named flpw-* also publishes a release once the build is done (release.yml).
on:
  push:
    branches:
      - dev
    tags:
      - "*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FBT_GIT_SUBMODULE_SHALLOW: 1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the size report of the build to compare with
      pull-requests: read # read the labels of the pull request (flash-budget)
    strategy:
      fail-fast: false
      matrix:
        # f18 isn't built: Momentum-derived code doesn't link for it yet
        # (missing momentum/asset-pack libs and f18 HAL functions).
        target: [f7]
    steps:
      - name: "Checkout code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: "Get commit details"
        id: names
        run: |
          BUILD_TYPE='DEBUG=0 COMPACT=1'
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            TYPE="pull"
          elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            TYPE="tag"
          else
            TYPE="other"
          fi
          python3 scripts/get_env.py "--event_file=${{ github.event_path }}" "--type=$TYPE" || cat "${{ github.event_path }}"
          echo "event_type=$TYPE" >> $GITHUB_OUTPUT
          echo "FBT_BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "TARGET=${{ matrix.target }}" >> $GITHUB_ENV
          echo "TARGET_HW=$(echo "${{ matrix.target }}" | sed 's/f//')" >> $GITHUB_ENV

      - name: "Check API versions for consistency between targets"
        run: |
          set -e
          N_API_HEADER_SIGNATURES=`ls -1 targets/f*/api_symbols.csv | xargs -I {} sh -c "head -n2 {} | md5sum" | sort -u | wc -l`
          if [ $N_API_HEADER_SIGNATURES != 1 ] ; then
            echo API versions aren\'t matching for available targets. Please update!
            echo API versions are:
            head -n2 targets/f*/api_symbols.csv
            exit 1
          fi

      # Informational only: flipware's API version is allowed to differ from
      # official firmware. A mismatch is reported as a warning and never fails
      # the build. Consistency between our own targets (above) and an
      # api_symbols.csv that is out of date with the headers ("Check for
      # uncommitted changes", below) still fail the job.
      - name: "Compare API version with OFW release channel (informational)"
        continue-on-error: true
        run: |
          symbols="targets/$TARGET/api_symbols.csv"
          ofw_api="$(curl -sf "https://raw.githubusercontent.com/flipperdevices/flipperzero-firmware/release/${symbols}" | head -n2)" || true
          our_api="$(head -n2 "${symbols}")"
          if [ -z "$ofw_api" ] ; then
            echo "::warning title=OFW API check skipped::Could not fetch the official firmware API version."
          elif [ "$our_api" != "$ofw_api" ] ; then
            echo "::warning title=API version differs from official firmware::Official $(tail -n1 <<< "$ofw_api"), flipware $(tail -n1 <<< "$our_api"). Apps built for one may not load on the other."
          else
            echo "API version matches official firmware: $(tail -n1 <<< "$our_api")"
          fi

      - name: "Restore toolchain"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: toolchain
          key: fbt-toolchain-${{ runner.os }}-${{ hashFiles('scripts/toolchain/fbtenv.sh') }}

      - name: "Build the firmware and apps"
        id: build-fw
        run: |
          ./fbt TARGET_HW=$TARGET_HW $FBT_BUILD_TYPE copro_dist updater_package fap_dist
          echo "firmware_api=$(./fbt TARGET_HW=$TARGET_HW get_apiversion)" >> $GITHUB_OUTPUT

      - name: "Check for uncommitted changes"
        run: |
          git diff --exit-code

      # The update folder, zipped, for people who copy it to the SD card by hand.
      # (fbt itself only makes the .tgz for qFlipper.)
      - name: "Zip the update folder"
        run: |
          set -e
          update_dir=$(ls -d dist/${TARGET}-*/${TARGET}-update-*/ | head -n1)
          python3 - "$update_dir" "$(dirname "$update_dir")/flipper-z-${TARGET}-update-${SUFFIX}" <<'PY'
          import shutil, sys
          shutil.make_archive(sys.argv[2], "zip", root_dir=sys.argv[1])
          PY
          ls -l dist/${TARGET}-*/flipper-z-${TARGET}-update-*

      - name: "Upload artifacts to GitHub"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flipper-z-${{ env.TARGET }}-${{ env.SUFFIX }}
          path: |
            dist/${{ env.TARGET }}-*/flipper-z-${{ env.TARGET }}-update-*
            dist/${{ env.TARGET }}-*/flipper-z-${{ env.TARGET }}-sdk-*
            dist/${{ env.TARGET }}-*/flipper-z-${{ env.TARGET }}-full-*.dfu

      - name: "Write build summary"
        run: |
          {
            echo "### ${TARGET} firmware for \`${COMMIT_SHA}\`"
            echo "- API version: \`${{ steps.build-fw.outputs.firmware_api }}\`"
            echo "- Update package and SDK: artifact \`flipper-z-${TARGET}-${SUFFIX}\` on this run"
          } >> "$GITHUB_STEP_SUMMARY"

      # Find the build to compare flash and RAM with: for a pull request, the dev
      # build of the commit it branched from (or the latest dev build); for a
      # push to dev, the build of the previous dev commit.
      - name: "Find the build to compare with"
        id: baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -e
          mkdir -p size-baseline
          base_sha=""
          if [ "$EVENT" = pull_request ] ; then
            base_sha=$(gh api "repos/$GITHUB_REPOSITORY/compare/dev...$PR_HEAD" --jq .merge_base_commit.sha) || true
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/dev ] ; then
            base_sha="$PUSH_BEFORE"
          else
            echo "No comparison for this kind of build."
            exit 0
          fi
          # The build of an exact commit is used whatever its result: a dev build
          # that failed a gate still uploaded its report, and skipping it would
          # charge dev's own growth to the next PR. Only the "latest dev build"
          # fallback is limited to successful runs.
          find_run() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch dev \
              --event push --limit 1 "$@" --json databaseId --jq '.[0].databaseId // empty'
          }
          find_latest_run() { find_run --status success; }
          run_id=""
          note=""
          if [ -n "$base_sha" ] ; then
            run_id=$(find_run --commit "$base_sha") || true
            note="dev build ${base_sha:0:8}"
          fi
          if [ -z "$run_id" ] ; then
            run_id=$(find_latest_run) || true
            note="latest dev build"
          fi
          if [ -z "$run_id" ] ; then
            echo "No earlier dev build found."
            exit 0
          fi
          if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "size-report-$TARGET" --dir size-baseline ; then
            echo "note=$note (run $run_id)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "That build has no size report (older than this feature, or expired). Trying the latest dev build."
          latest_id=$(find_latest_run) || true
          if [ -n "$latest_id" ] && [ "$latest_id" != "$run_id" ] \
              && gh run download "$latest_id" --repo "$GITHUB_REPOSITORY" --name "size-report-$TARGET" --dir size-baseline ; then
            echo "note=latest dev build (run $latest_id)" >> "$GITHUB_OUTPUT"
          else
            echo "No size report to compare with."
          fi

      # The numbers, the comparison and the gates are in scripts/size_report.py;
      # the limits are in .github/size_budget.json. Runs last so a red gate still
      # leaves the packages uploaded; the report is uploaded and commented either way.
      - name: "Flash and RAM report"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASELINE_NOTE: ${{ steps.baseline.outputs.note }}
        run: |
          # A pull request is held to the limits of the branch it targets, not
          # the ones in its own tree, so it can't loosen its own gate. Changing
          # .github/size_budget.json takes effect once it is merged. (Before the
          # base branch has the file, the PR's own copy is used.)
          budget=.github/size_budget.json
          if [ -n "$PR_NUMBER" ] ; then
            git fetch --no-tags --depth 1 origin "$BASE_REF"
            if git show "FETCH_HEAD:$budget" > size_budget.base.json 2>/dev/null ; then
              if ! cmp -s size_budget.base.json "$budget" ; then
                echo "::notice::This PR changes $budget; it is checked against the limits of $BASE_REF."
              fi
              budget=size_budget.base.json
            fi
          fi
          # The growth limit is for pull requests. After a merge (push to dev) and
          # on tags it is skipped, so a PR that was allowed to grow by the
          # flash-budget label doesn't turn dev red; the free-flash minimum still applies.
          growth="--growth-allowed"
          if [ -n "$PR_NUMBER" ] ; then
            labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' || true)
            if ! echo "$labels" | grep -qx flash-budget ; then
              growth=""
            fi
          fi
          elf=$(ls dist/${TARGET}-*/flipper-z-${TARGET}-firmware-*.elf | head -n1)
          update_dir=$(ls -d dist/${TARGET}-*/${TARGET}-update-*/ | head -n1)
          # The linker map, for the flash-by-library table (and kept as an artifact).
          map=$(ls build/${TARGET}-firmware-*/firmware.elf.map 2>/dev/null | head -n1 || true)
          map_args=""
          if [ -n "$map" ] ; then
            cp "$map" "firmware-$TARGET.map"
            map_args="--map $map"
          else
            echo "::warning::No linker map found; the report has no flash-by-library table."
          fi
          if [ -n "$map" ] ; then
            echo "::group::Linker map: biggest libraries, objects and who pulls in float and strtod code"
            python3 scripts/linkmap.py "$map" --top 80 \
              --why _strtod_l --why strtod --why strtof --why atof --why powf --why pow \
              --why _printf_float --why _scanf_float --why __ssprint_r --why _svfprintf_r \
              --why _vfprintf_r --why __d2b --why __ieee754_pow --why __aeabi_dmul --why __aeabi_ddiv \
              --why __aeabi_fmul --why __aeabi_fdiv --why __aeabi_f2d --why __aeabi_d2f || true
            echo "::endgroup::"
          fi
          status=0
          python3 scripts/size_report.py --elf "$elf" --update-dir "$update_dir" $map_args \
            --budget "$budget" --target "$TARGET" $growth \
            --baseline "size-baseline/size-$TARGET.json" \
            --baseline-note "${BASELINE_NOTE:-nothing (no earlier build to compare with)}" \
            --out-json "size-$TARGET.json" --out-md "size-report.md" || status=$?
          cat size-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: "Upload the size report"
        if: ${{ !cancelled() && hashFiles('size-report.md') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: size-report-${{ env.TARGET }}
          path: |
            size-${{ env.TARGET }}.json
            size-report.md

      # The full linker map (with the cross reference table), for digging into
      # what pulls a symbol in: scripts/linkmap.py firmware-f7.map --why SYMBOL
      - name: "Upload the linker map"
        if: ${{ !cancelled() && hashFiles(format('firmware-{0}.map', env.TARGET)) != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linker-map-${{ env.TARGET }}
          path: firmware-${{ env.TARGET }}.map
          retention-days: 14

  # Posts (or updates) the size report as a comment on the pull request. It is a
  # separate job so that the job that builds the pull request's code never holds
  # a token that can write to the pull request. On a fork's pull request the
  # token is read-only; the comment is skipped and the report is still in the
  # job summary.
  size-comment:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: "Post the size report"
        continue-on-error: true
        run: |
          set -e
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'size-report-*' --dir report || { echo "No size report to post."; exit 0; }
          file=$(ls report/*/size-report.md | head -n1)
          marker='<!-- flipware-size-report -->'
          head -n1 "$file" | grep -qxF "$marker" || { echo "Unexpected report format."; exit 1; }
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("'"$marker"'")) | .id' | head -n1)
          if [ -n "$id" ] ; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$file" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$file"
          fi

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/flpw-')
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml

  # Boots the update package in FlipperEmu and runs its checks (boot, update,
  # coprocessor, BLE, serial ports, PIN lock). Not run for tags (the release
  # is built from a commit that passed on dev) or for pull requests from forks
  # (the emulator image is kept in this repository's registry).
  emulator:
    needs: build
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/emulator.yml
